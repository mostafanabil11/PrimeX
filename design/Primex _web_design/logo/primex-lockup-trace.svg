<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 312" width="600" height="312">
  <!--
    PrimeX lockup — vector trace of the master logo.

    This is the shape the site actually renders. It is kept here so the design
    folder holds something editable rather than only a screenshot, and so the
    geometry can be checked against the master without opening the app.

    It is a TRACE, not the master. Two known divergences:

      - The word is set in Anybody, which is not the logo's typeface. The real
        one is wider and shorter; at matching cap height it runs about 10%
        wider than Anybody reaches without letter-spacing that would look
        sprung. Cap height is matched and the width left slightly narrow.
      - Curves and corner radii on the barbs are drawn as straight cuts.

    In the app this is a React component (Frontend/src/components/layout/
    wordmark.tsx) rather than this file, because there the word is live text
    that inherits the page font and the red comes from the --primary token.
    Here both are hardcoded so the file stands alone.

    Replace both when the real vector arrives from whoever cut the sign.
  -->
  <title>PrimeX — Commit to be fit</title>

  <!-- The bolt. One stroke of lightning passing behind the word: the two
       shapes are what you can see of it either side of the letters, which is
       why they are offset rather than mirrored. Each is a barb — four points,
       with a notch cut into the base — not a plain triangle. -->
  <path d="M0 312 L245 199 L94 197 L127 225 Z" fill="#d12028"/>
  <path d="M600 1 L355 114 L506 115 L472 88 Z" fill="#d12028"/>

  <text x="123" y="184"
        font-family="Anybody, 'Arial Black', sans-serif"
        font-size="76" font-weight="900" font-style="italic"
        letter-spacing="1" fill="#ffffff">Primex</text>

  <text x="474" y="207" text-anchor="end"
        font-family="Anybody, Arial, sans-serif"
        font-size="17" font-weight="500" font-style="italic"
        fill="#ffffff">Commit to be fit</text>
</svg>
