<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Favicon: the bolt alone, no wordmark.

    "PrimeX" is unreadable at 16px, which is the size that actually matters in
    a tab strip, so the mark has to carry the brand by silhouette. This is a
    solid chunky bolt rather than the two thin darts of the full lockup — those
    are tuned to flank a word at header size and disappear entirely once
    scaled to a favicon.

    Square, not rounded: the design language is 0px corners everywhere, and the
    icon is the one place a stray border-radius would be seen next to every
    other tab's rounded icon and read as deliberate.
  -->
  <rect width="64" height="64" fill="#121414"/>
  <path d="M38 4 L14 36 L28 36 L24 60 L50 26 L34 26 Z" fill="#e60000"/>
</svg>
