<!DOCTYPE html>
<html>
<head>
    <title>Logo Preview</title>
    <style>
        body {
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            margin-top: 50px;
        }
        .container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .preview-box {
            border: 1px solid #ccc;
            padding: 20px;
            background-color: white; /* to see transparency if any */
            background-image: linear-gradient(45deg, #e0e0e0 25%, transparent 25%), 
                              linear-gradient(-45deg, #e0e0e0 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #e0e0e0 75%), 
                              linear-gradient(-45deg, transparent 75%, #e0e0e0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        img {
            max-width: 400px;
        }
    </style>
</head>
<body>
    <h2>Logo Previews</h2>
    <div class="container">
        <div>
            <h3>Original Cropped</h3>
            <div class="preview-box">
                <img src="logo_cropped.jpg" alt="Cropped">
            </div>
        </div>
        <div>
            <h3>Transparent (OpenCV)</h3>
            <div class="preview-box">
                <img src="logo_transparent.png" alt="Transparent">
            </div>
        </div>
        <div>
            <h3>Transparent (Rembg)</h3>
            <div class="preview-box">
                <img src="logo_rembg.png" alt="Rembg">
            </div>
        </div>
    </div>
</body>
</html>
